</script><script type="application/ld+json">{"@context":"https://schema.org","@type":"JobPosting","@id":"https://ictjobs.ch/software-entwicklung/oracle-pl-sql-developer-f-m-x/#job","title":"Oracle PL/SQL Developer (f/m/x)","description":"IntroductionIn this role, you’ll work in one of our IBM Consulting Client Innovation Centers (Delivery Centers), where we deliver deep technical and industry expertise to a wide range of public and private sector clients the around world. Our delivery centers offer our clients locally based skills and technical expertise to drive innovation and adoption of new technology.\nA career in IBM Consulting embraces long-term relationships and close collaboration with clients across the globe.\nYou’ll work with visionaries across multiple industries to improve the hybrid and AI journey for the most innovative and valuable companies in the world. Your ability to accelerate impact and make meaningful change for your clients is enabled by our strategic partner ecosystem and our robust technology platforms across the IBM portfolio; including IBM Software and Red Hat.\nCuriosity and a constant quest for knowledge serve as the foundation to success in IBM Consulting. In your role, you’ll be encouraged to challenge the norm, investigate ideas outside of your role, and come up with creative solutions resulting in ground breaking impact for a wide network of clients. Our culture of evolution and empathy centers on long-term career growth and development opportunities in an environment that embraces your unique skills and experience.\nIn this role, you’ll work in one of our IBM Consulting Client Innovation Centers (Delivery Centers), where we deliver deep technical and industry expertise to a wide range of public and private sector clients around the world. Our delivery centers offer our clients locally based skills and technical expertise to drive innovation and adoption of new technology.\nYour role and responsibilitiesWe are looking for an experienced Senior Oracle PL/SQL Developer to work on critical banking database solutions and complex data environments. The successful candidate will participate in projects that are implementing database solutions for the Bank to meet user needs or comply with legal and regulatory requirements. This operational database provides the Bank and client applications with data to meet business challenges.\n\nDevelop DB programs, using the agile method.\nIntegrate data from different systems and expose them in a consistent manner.\nCreate business data corresponding to user needs\nDevelop and maintain analytical systems\nDevelop and maintain test scripts for automated testing purposes.\n\nChallengesThe bank uses a huge operational database providing data to several dozen critical applications. The IT landscape is quite complex and changes or developments must be made with this complexity in mind to avoid degrading performance and data delivery times to system clients.\nJob Responsibilities\n\nDevelop and maintain Oracle PL/SQL procedures and packages.\nDesign database solutions and batch-processing processes.\nIntegrate data from multiple systems and ensure consistent data delivery.\nDevelop Unix scripts and production deployment scripts.\nSupport integration, system and user acceptance testing.\nInvestigate and resolve database and performance issues.\nProvide post-go-live support and maintain technical documentation.\nParticipate in Agile project and technical sessions.\n\nWhat we offer: \n\nIndividual career path\nAccess to countless trainings and certification offerings\nA knowledge sharing culture\nAn environment where you are actively contributing your ideas\nThe possibility to work in projects in one of the largest IT companies\n\nRequired educationBachelor’s Degree\nPreferred educationMaster’s Degree\nRequired technical and professional expertise\n\nExtensive Oracle PL/SQL development experience.\nStrong experience in Procedures, packages, database design and batch processing.\nKnowledge of Unix scripting.\nExperience with MS SQL Server, SSAS and/or Sybase IQ.\nStrong Deployment and production support experience.\nExperience with integration and user testing.\nAgile project experience.\nBanking domain experience.\nStrong French and English communication skills.\nSwiss or EU nationality, or a valid Swiss work permit.\n\nABOUT BUSINESS UNITIBM Consulting is IBM’s consulting and global professional services business, with market leading capabilities in business and technology transformation. With deep expertise in many industries, we offer strategy, experience, technology, and operations services to many of the most innovative and valuable companies in the world. Our people are focused on accelerating our clients’ businesses through the power of collaboration. We believe in the power of technology responsibly used to help people, partners and the planet.\nYOUR LIFE @ IBMIn a world where technology never stands still, we understand that, dedication to our clients success, innovation that matters, and trust and personal responsibility in all our relationships, lives in what we do as IBMers as we strive to be the catalyst that makes the world work better.\nBeing an IBMer means you’ll be able to learn and develop yourself and your career, you’ll be encouraged to be courageous and experiment everyday, all whilst having continuous trust and support in an environment where everyone can thrive whatever their personal or professional background.\nOur IBMers are growth minded, always staying curious, open to feedback and learning new information and skills to constantly transform themselves and our company. They are trusted to provide on-going feedback to help other IBMers grow, as well as collaborate with colleagues keeping in mind a team focused approach to include different perspectives to drive exceptional outcomes for our customers. The courage our IBMers have to make critical decisions everyday is essential to IBM becoming the catalyst for progress, always embracing challenges with resources they have to hand, a can-do attitude and always striving for an outcome focused approach within everything that they do.\nAre you ready to be an IBMer?\nABOUT IBMIBM’s greatest invention is the IBMer. We believe that through the application of intelligence, reason and science, we can improve business, society and the human condition, bringing the power of an open hybrid cloud and AI strategy to life for our clients and partners around the world.\nRestlessly reinventing since 1911, we are not only one of the largest corporate organizations in the world, we’re also one of the biggest technology and consulting employers, with many of the Fortune 500 companies relying on the IBM Cloud to run their business. \nAt IBM, we pride ourselves on being an early adopter of artificial intelligence, quantum computing and blockchain. Now it’s time for you to join us on our journey to being a responsible technology innovator and a force for good in the world.\nIBM is proud to be an equal-opportunity employer. All qualified applicants will receive consideration for employment without regard to race, color, religion, sex, gender, gender identity or expression, sexual orientation, national origin, genetics, pregnancy, disability, neurodivergence, age, or other characteristics protected by the applicable law. IBM is also committed to compliance with all fair employment practices regarding citizenship and immigration status.\nOTHER RELEVANT JOB DETAILSIBM wants you to bring your whole self to work and for you this might mean the ability to work flexibly. If you are interested in a flexible working pattern, please talk to our recruitment team to find out if this is possible in the current working environment.","datePosted":"2026-10-19","validThrough":"2026-12-18T23:59","employmentType":["FULL_TIME","PART_TIME"],"identifier":{"@type":"PropertyValue","name":"Oracle PL/SQL Developer (f/m/x)","value":"199935"},"hiringOrganization":{"@typ
