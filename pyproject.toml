[project]
name = "swiss-tech-jobs"
version = "0.1.0"
description = "Daily scraper for Swiss tech jobs with PostgreSQL storage and Telegram notifications"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "selenium>=4.20",
    "sqlalchemy>=2.0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "respx>=0.21",
    "testcontainers[postgres]>=4.5",
]

[project.scripts]
jobs-scrape = "jobscraper.cli:scrape_main"
jobs-notify = "jobscraper.cli:notify_main"
jobs-migrate = "jobscraper.cli:migrate_main"
jobs-cleanup = "jobscraper.cli:cleanup_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobscraper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "live: hits real job sites over the network (run with -m live)",
]
